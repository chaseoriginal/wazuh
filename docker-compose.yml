# Wazuh v4.14.6 - Single Node Deployment on ore-dock-104-2
# Adapted from: https://github.com/wazuh/wazuh-docker/tree/v4.14.6/single-node
#

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.6
    hostname: wazuh.manager
    container_name: wazuh-manager
    restart: always
    entrypoint: /wazuh-entrypoint.sh
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
      - AWS_SHARED_CREDENTIALS_FILE=/var/ossec/.aws/credentials
      - AWS_CONFIG_FILE=/var/ossec/.aws/config
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/etc/ssl/root-ca.pem:ro
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - /data/compose/wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - /data/compose/wazuh/config/wazuh_cluster/.aws:/var/ossec/.aws:ro
      - /data/compose/wazuh/config/wazuh_cluster/wazuh-entrypoint.sh:/wazuh-entrypoint.sh:ro
      - /data/compose/wazuh/config/wazuh_cluster/github/logs/github-audit.log:/var/ossec/logs/github-audit.log:rw
    networks:
      - wazuh-net

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.6
    hostname: wazuh.indexer
    container_name: wazuh-indexer
    restart: always
    ports:
      - "9201:9200"
    environment:
      # Heap must be sized for the data volume, not the initial empty cluster.
      # At 1g the indexer OOMs ("java.lang.OutOfMemoryError: Java heap space"),
      # exits 127, and crash-loops under restart:always, which leaves the
      # dashboard stuck on "waiting until all OpenSearch nodes are compatible".
      # The indexer holds ~21 GB / 180 indices; 4g is the size the stack ran
      # at before the GitOps migration wrote 1g into this file.
      - "OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - /data/compose/wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - /data/compose/wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    networks:
      - wazuh-net

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.6
    hostname: wazuh.dashboard
    container_name: wazuh-dashboard
    restart: always
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
    volumes:
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - /data/compose/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - /data/compose/wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - /data/compose/wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:rw
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    networks:
      - wazuh-net

volumes:
  wazuh_api_configuration:
    name: wazuh_wazuh_api_configuration
  wazuh_etc:
    name: wazuh_wazuh_etc
  wazuh_logs:
    name: wazuh_wazuh_logs
  wazuh_queue:
    name: wazuh_wazuh_queue
  wazuh_var_multigroups:
    name: wazuh_wazuh_var_multigroups
  wazuh_integrations:
    name: wazuh_wazuh_integrations
  wazuh_active_response:
    name: wazuh_wazuh_active_response
  wazuh_agentless:
    name: wazuh_wazuh_agentless
  wazuh_wodles:
    name: wazuh_wazuh_wodles
  filebeat_etc:
    name: wazuh_filebeat_etc
  filebeat_var:
    name: wazuh_filebeat_var
  wazuh-indexer-data:
    name: wazuh_wazuh-indexer-data
  wazuh-dashboard-config:
    name: wazuh_wazuh-dashboard-config
  wazuh-dashboard-custom:
    name: wazuh_wazuh-dashboard-custom
networks:
  wazuh-net:
    driver: bridge